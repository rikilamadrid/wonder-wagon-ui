name: storybook-pages

# The public Storybook on GitHub Pages (decision D9). Built from main; the URL is recorded
# in the README's parts manifest once Pages is enabled in repository settings (human).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build
        working-directory: apps/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storybook/storybook-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
