name: pages

# The one GitHub Pages artifact (decision D13, superseding D10): the Wonder Wagon Catalog at
# the site root and the Storybook laboratory at /storybook/, built from main. Old Storybook
# links at the root forward to /storybook/. The catalog reads committed evidence only; no
# step here reaches npm or GitHub for content.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build the Storybook laboratory
        run: bun run build
        working-directory: apps/storybook
      - name: Build the catalog, check its evidence, assemble and validate the artifact
        working-directory: apps/docs
        run: |
          bun run test
          bun run build
          bun run pages
          bun run pages:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.site/wonder-wagon-ui
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
