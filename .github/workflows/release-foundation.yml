name: release foundation

# The portfolio-wide Changesets publisher stays disabled until every public
# workspace is approved and bootstrapped. This workflow deliberately publishes
# only the React-free foundation package.
#
# Convergent. `plan` reads the registry and picks a mode:
#
#   new       npm lacks the version: build and verify this commit, which must
#             be the tip of main, publish it, read it back (gitHead == this
#             commit, integrity == the verified pack), then tag and release it.
#   recovery  npm has the version: its registry gitHead is the release commit.
#             Fetch it, require it on main, rebuild it in a detached worktree,
#             require its pack to equal the registry's integrity, read it back,
#             then tag and release that commit. Never publishes.
#
# The tag and the GitHub Release are each created only if absent, and only
# after the registry readback. So re-dispatch after any post-publish partial
# failure is safe even if main has advanced. The steps live in
# .github/scripts/release-foundation.sh and are exercised by its tests.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact wonder-wagon-ui version already committed on main
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency: release-foundation

jobs:
  publish:
    name: Publish wonder-wagon-ui
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Build and verify take a few minutes; registry readback can take ten.
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Deliberately no registry-url: npm exchanges GitHub's OIDC token
          # directly and an empty generated _authToken would shadow it.
      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TREE: ${{ runner.temp }}/release-tree
        run: .github/scripts/release-foundation.sh plan
      - name: Check out the published release commit for recovery
        if: steps.plan.outputs.complete == 'no' && steps.plan.outputs.mode == 'recovery'
        env:
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
          RELEASE_TREE: ${{ steps.plan.outputs.tree }}
        run: .github/scripts/release-foundation.sh prepare
      - name: Ensure npm supports trusted publishing
        if: steps.plan.outputs.complete == 'no'
        run: |
          set -euo pipefail
          npm install --global npm@latest
          echo "npm $(npm --version), node $(node --version)"
          if [ "$(printf '11.5.1\n%s\n' "$(npm --version)" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $(npm --version) is older than 11.5.1 and cannot publish via OIDC"
            exit 1
          fi
      - if: steps.plan.outputs.complete == 'no'
        working-directory: ${{ steps.plan.outputs.tree }}
        run: bun install --frozen-lockfile
      - name: Build and verify the exact release commit
        if: steps.plan.outputs.complete == 'no'
        working-directory: ${{ steps.plan.outputs.tree }}
        run: |
          bun run build
          bun run check
          bun run test
      - name: Verify version and packed allowlist
        id: verify
        if: steps.plan.outputs.complete == 'no'
        env:
          TREE: ${{ steps.plan.outputs.tree }}
          REGISTRY_INTEGRITY: ${{ steps.plan.outputs.registry_integrity }}
        run: .github/scripts/release-foundation.sh verify
      # The first irreversible step, and only for a new release: from the
      # workspace, which plan proved is the tip of main.
      - name: Publish with npm trusted publishing
        if: steps.plan.outputs.complete == 'no' && steps.plan.outputs.mode == 'new'
        working-directory: packages/foundation
        run: npm publish --access public --provenance
      - name: Confirm the registry serves this version from the release commit
        if: steps.plan.outputs.complete == 'no'
        env:
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
          EXPECTED_INTEGRITY: ${{ steps.verify.outputs.integrity }}
        run: .github/scripts/release-foundation.sh readback
      - name: Tag the release commit
        if: steps.plan.outputs.complete == 'no' && steps.plan.outputs.tagged == 'no'
        env:
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
        run: .github/scripts/release-foundation.sh tag
      - name: Create the GitHub Release
        if: steps.plan.outputs.complete == 'no' && steps.plan.outputs.released == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.plan.outputs.tree }}
        run: .github/scripts/release-foundation.sh release
