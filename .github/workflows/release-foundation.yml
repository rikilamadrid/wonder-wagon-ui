name: release foundation

# The portfolio-wide Changesets publisher stays disabled until every public
# workspace is approved and bootstrapped. This workflow deliberately publishes
# only the React-free foundation package.
#
# Convergent, in this order: plan → build and verify → publish (only if npm
# lacks the version) → registry readback (the exact version, from this
# commit) → tag (only if absent) → GitHub Release (only if absent). Nothing is
# tagged or released until the registry serves the version with gitHead equal
# to this commit, so a run that dies anywhere is repaired by dispatching it
# again from the same main commit. The steps live in
# .github/scripts/release-foundation.sh and are exercised by its tests.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact wonder-wagon-ui version already committed on main
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency: release-foundation

jobs:
  publish:
    name: Publish wonder-wagon-ui
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Build and verify take a few minutes; registry readback can take ten.
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Deliberately no registry-url: npm exchanges GitHub's OIDC token
          # directly and an empty generated _authToken would shadow it.
      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-foundation.sh plan
      - name: Ensure npm supports trusted publishing
        if: steps.plan.outputs.complete == 'no'
        run: |
          set -euo pipefail
          npm install --global npm@latest
          echo "npm $(npm --version), node $(node --version)"
          if [ "$(printf '11.5.1\n%s\n' "$(npm --version)" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $(npm --version) is older than 11.5.1 and cannot publish via OIDC"
            exit 1
          fi
      - if: steps.plan.outputs.complete == 'no'
        run: bun install --frozen-lockfile
      - name: Build and verify the exact release commit
        if: steps.plan.outputs.complete == 'no'
        run: |
          bun run build
          bun run check
          bun run test
      - name: Verify version and packed allowlist
        id: verify
        if: steps.plan.outputs.complete == 'no'
        working-directory: packages/foundation
        run: |
          set -euo pipefail
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "$RELEASE_VERSION" ]; then
            echo "::error::requested $RELEASE_VERSION but package.json contains $actual"
            exit 1
          fi
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node scripts/verify-pack.mjs < "$RUNNER_TEMP/pack.json"
          # The pack is deterministic, so the registry must serve these bytes.
          integrity="$(node -e '
            const output = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const [report] = Array.isArray(output) ? output : Object.values(output);
            process.stdout.write(report.integrity);
          ' "$RUNNER_TEMP/pack.json")"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
      # The first irreversible step, and only when npm lacks the version.
      - name: Publish with npm trusted publishing
        if: steps.plan.outputs.complete == 'no' && steps.plan.outputs.published == 'no'
        working-directory: packages/foundation
        run: npm publish --access public --provenance
      - name: Confirm the registry serves this version from this commit
        if: steps.plan.outputs.complete == 'no'
        env:
          EXPECTED_INTEGRITY: ${{ steps.verify.outputs.integrity }}
        run: .github/scripts/release-foundation.sh readback
      - name: Tag the release commit
        if: steps.plan.outputs.complete == 'no' && steps.plan.outputs.tagged == 'no'
        run: .github/scripts/release-foundation.sh tag
      - name: Create the GitHub Release
        if: steps.plan.outputs.complete == 'no' && steps.plan.outputs.released == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-foundation.sh release
