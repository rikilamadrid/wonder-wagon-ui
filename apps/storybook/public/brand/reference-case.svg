<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44" role="img" aria-label="Wonder Wagon UI — the Reference Case">
  <title>Wonder Wagon UI</title>
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8863A"/><stop offset=".55" stop-color="#A96E2D"/><stop offset="1" stop-color="#6E4519"/></linearGradient>
    <linearGradient id="enamel" x1=".15" y1="0" x2=".85" y2="1"><stop offset="0" stop-color="#3A7A2C"/><stop offset=".55" stop-color="#285A1C"/><stop offset="1" stop-color="#173A0F"/></linearGradient>
  </defs>
  <!-- the case: wide, hinged along the long edge, brass corners, a well and a latch -->
  <g transform="translate(2 6)">
    <rect x="0" y="4" width="48" height="26" rx="4" fill="#2B2622"/>
    <rect x="2" y="6" width="44" height="14" rx="2.5" fill="url(#enamel)"/>
    <rect x="2" y="6" width="44" height="1.2" fill="#FFF7E6" opacity=".3"/>
    <rect x="10" y="2" width="8" height="3" rx="1" fill="url(#brass)"/><rect x="30" y="2" width="8" height="3" rx="1" fill="url(#brass)"/>
    <rect x="19" y="9" width="10" height="7" rx="1.5" fill="#101C10"/><rect x="21.5" y="11" width="5" height="3" rx=".5" fill="url(#brass)"/>
    <rect x="0" y="4" width="6" height="6" fill="url(#brass)"/><rect x="42" y="4" width="6" height="6" fill="url(#brass)"/><rect x="0" y="24" width="6" height="6" fill="url(#brass)"/><rect x="42" y="24" width="6" height="6" fill="#7A5A2A"/>
    <rect x="19" y="22" width="10" height="5" rx="1" fill="url(#brass)"/><rect x="22" y="20" width="4" height="2" fill="#E2B26A"/>
  </g>
  <text x="62" y="21" font-family="Georgia, 'Iowan Old Style', serif" font-size="16" fill="#F7F0DF">Wonder Wagon UI</text>
  <text x="62" y="35" font-family="ui-monospace, Menlo, monospace" font-size="8" font-weight="800" letter-spacing="1.2" fill="#CDC2AA">THE BENCH · WW-047</text>
</svg>
